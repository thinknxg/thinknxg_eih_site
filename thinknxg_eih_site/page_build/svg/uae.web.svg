-anchor="start" >TRN-based identification</text><text x="450" y="852" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Supplier and buyer identified by Tax</text><text x="450" y="871" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Registration Number, with validation before</text><text x="450" y="890" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >submission.</text><rect x="804" y="790" width="352" height="120" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="804" y="790" width="352" height="6" rx="3" fill="#17B890" stroke="none" stroke-width="1.5" /><text x="822" y="826" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >Full document range</text><text x="822" y="852" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Tax invoices, credit notes, self-billing,</text><text x="822" y="871" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >reverse charge, exempt and zero-rated</text><text x="822" y="890" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >supplies.</text><rect x="1176" y="790" width="352" height="120" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="1176" y="790" width="352" height="6" rx="3" fill="#17B890" stroke="none" stroke-width="1.5" /><text x="1194" y="826" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >AED and foreign currency</text><text x="1194" y="852" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >AED tax amounts calculated and shown for</text><text x="1194" y="871" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >foreign-currency invoices.</text><path d="M60 934 H1540" fill="none" stroke="#D5DEEA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="962" font-size="13" font-weight="500" fill="#8A97A8" text-anchor="start" >The ASP performs regulatory reporting to the FTA. The hub prepares, validates, submits and tracks the outcome.</text><text x="1540" y="962" font-size="13" font-weight="700" fill="#2878E5" text-anchor="end" >kreatao.com/E-InvoiceHub</text></svg>