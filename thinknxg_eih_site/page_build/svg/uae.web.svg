Buyer's ASP</text><text x="966" y="562" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Accredited Service</text><text x="966" y="581" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Provider</text><rect x="1290" y="473" width="240" height="150" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.06" /><rect x="1290" y="470" width="240" height="150" rx="16" fill="#FFFFFF" stroke="#17B890" stroke-width="2" /><rect x="1306" y="486" width="46" height="24" rx="12" fill="#17B890" stroke="none" stroke-width="1.5" /><text x="1329" y="503" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" >C4</text><text x="1306" y="538" font-size="21" font-weight="800" fill="#101C35" text-anchor="start" >Buyer</text><text x="1306" y="562" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Receives the PINT AE</text><text x="1306" y="581" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >invoice</text><path d="M280 545 C305.0 545 305.0 545 330 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><path d="M560 545 C585.0 545 585.0 545 610 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><path d="M850 545 H950" fill="none" stroke="#2878E5" stroke-width="5" marker-end="url(#m2878E5e)" marker-start="url(#m2878E5s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="862.8" y="496" width="74.4" height="28" rx="14" fill="#FFFFFF" stroke="#2878E5" stroke-width="1.4" /><text x="900" y="515" font-size="14" font-weight="700" fill="#2878E5" text-anchor="middle" >Peppol</text><path d="M1190 545 C1240.0 545 1240.0 545 1290 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-line