<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1600 810" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Invoice processing lifecycle</title><desc id="d">Outbound: Receive, Normalize, Validate, Process, Submit, Track, Reconcile, Synchronize. Inbound: provider delivery, parsing, company match, validation and ERP draft.</desc><defs><style>.flow{stroke-dasharray:7 9;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pulse{animation:pl 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{50%{transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2878E5"/><stop offset="1" stop-color="#21C5D9"/></linearGradient><marker id="m101C35e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#101C35"/></marker></defs><rect width="1600" height="1000" fill="#F4F7FB"/><text x="60" y="70" font-size="15" font-weight="800" fill="#2878E5" text-anchor="start" letter-spacing="2.5" >INFOGRAPHIC 06</text><text x="60" y="122" font-size="44" font-weight="800" fill="#101C35" text-anchor="start" >Invoice processing lifecycle</text><text x="60" y="160" font-size="20" font-weight="500" fill="#536174" text-anchor="start" >Outbound and inbound, from ERP to network and back.</text><rect x="1270" y="40" width="44" height="44" rx="12" fill="url(#lg1)" stroke="none" stroke-width="1.5" /><path d="M1292 62 L1281 53" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1281" cy="53" r="3.2" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><path d="M1292 62 L1303 53" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1303" cy="53" r="3.2" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><path d="M1292 62 L1281 71" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1281" cy="71" r="3.2" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><path d="M1292 62 L1303 71" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1303" cy="71" r="3.2" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><circle cx="1292" cy="62" r="5.5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="1326" y="60" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >thinkNXG</text><text x="1326" y="80" font-size="15" font-weight="600" fill="#536174" text-anchor="start" >E-Invoice Hub</text><rect x="40" y="210" width="1520" height="330" rx="20" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.4" /><rect x="40" y="210" width="8" height="330" rx="4" fill="#2878E5" stroke="none" stroke-width="1.5" /><text x="70" y="250" font-size="14" font-weight="800" fill="#2878E5" text-anchor="start" letter-spacing="1.6" >OUTBOUND  ·  ERP to network</text><rect x="66" y="276" width="168" height="60" rx="14" fill="#2878E5" stroke="none" stroke-width="1.5" /><text x="84" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >1</text><text x="106" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Receive</text><text x="70" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >ERP invoice arrives by</text><text x="70" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >connector, API or</text><text x="70" y="406" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >signed webhook.</text><path d="M236 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="250" y="276" width="168" height="60" rx="14" fill="#2878E5" stroke="none" stroke-width="1.5" /><text x="268" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >2</text><text x="290" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Normalize</text><text x="254" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Mapped into the</text><text x="254" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >canonical invoice</text><text x="254" y="406" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >model.</text><path d="M420 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="434" y="276" width="168" height="60" rx="14" fill="#1F9AD8" stroke="none" stroke-width="1.5" /><text x="452" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >3</text><text x="474" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Validate</text><text x="438" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Country rules and tax</text><text x="438" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >checks before anything</text><text x="438" y="406" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >is sent.</text><path d="M604 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="618" y="276" width="168" height="60" rx="14" fill="#21C5D9" stroke="none" stroke-width="1.5" /><text x="636" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >4</text><text x="658" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Process</text><text x="622" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >UBL document and</text><text x="622" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >identifiers generated.</text><path d="M788 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="802" y="276" width="168" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="820" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >5</text><text x="842" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Submit</text><text x="806" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Sent through your ASP</text><text x="806" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >or Access Point.</text><path d="M972 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="986" y="276" width="168" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="1004" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >6</text><text x="1026" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Track</text><text x="990" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Validation, provider,</text><text x="990" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >regulatory and Peppol</text><text x="990" y="406" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >outcomes.</text><path d="M1156 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1170" y="276" width="168" height="60" rx="14" fill="#13A98B" stroke="none" stroke-width="1.5" /><text x="1188" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >7</text><text x="1210" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Reconcile</text><text x="1174" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Provider status</text><text x="1174" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >matched to each</text><text x="1174" y="406" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >invoice.</text><path d="M1340 306 h12" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1354" y="276" width="168" height="60" rx="14" fill="#16A875" stroke="none" stroke-width="1.5" /><text x="1372" y="313" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >8</text><text x="1394" y="314" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Synchronize</text><text x="1358" y="366" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Final status written</text><text x="1358" y="386" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >back to the ERP.</text><path d="M66 470 H1530" fill="none" stroke="#D5DEEA" stroke-width="1.4" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="490" width="156" height="32" rx="16.0" fill="#FFFFFF" stroke="#16B8A5" stroke-width="1.6" /><text x="148.0" y="511.04" font-size="14" font-weight="700" fill="#101C35" text-anchor="middle" >Received</text><rect x="240" y="490" width="156" height="32" rx="16.0" fill="#FFFFFF" stroke="#16B8A5" stroke-width="1.6" /><text x="318.0" y="511.04" font-size="14" font-weight="700" fill="#101C35" text-anchor="middle" >Normalized</text><rect x="410" y="490" width="156" height="32" rx="16.0" fill="#FFFFFF" stroke="#16B8A5" stroke-width="1.6" /><text x="488.0" y="511.04" font-size="14" font-weight="700" fill="#101C35" text-anchor="middle" >Validated</text><rect x="580" y="490" width="156" height="32" rx="16.0" fill="#FFFFFF" stroke="#16B8A5" stroke-width="1.6" /><text x="658.0" y="511.04" font-size="14" font-weight="700" fill="#101C35" text-anchor="middle" >Submitted</text><rect x="750" y="490" width="156" height="32" rx="16.0" fill="#FFFFFF" stroke="#16B8A5" stroke-width="1.6" /><text x="828.0" y="511.04" font-size="14" font-weight="700" fill="#101C35" text-anchor="middle" >Delivered</text><text x="950" y="511" font-size="14" font-weight="600" fill="#536174" text-anchor="start" >Status shown for every invoice at every step.</text><rect x="40" y="570" width="1520" height="290" rx="20" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.4" /><rect x="40" y="570" width="8" height="290" rx="4" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="70" y="610" font-size="14" font-weight="800" fill="#16B8A5" text-anchor="start" letter-spacing="1.6" >INBOUND  ·  Network to ERP</text><rect x="66" y="636" width="230" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="84" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >1</text><text x="106" y="674" font-size="17.0" font-weight="800" fill="#FFFFFF" text-anchor="start" >Provider delivers</text><text x="70" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Signed webhook, inbound API</text><text x="70" y="746" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >or polling.</text><path d="M298 666 h14" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="314" y="636" width="230" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="332" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >2</text><text x="354" y="674" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Detect country</text><text x="318" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >The right country engine is</text><text x="318" y="746" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >chosen automatically.</text><path d="M546 666 h14" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="562" y="636" width="230" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="580" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >3</text><text x="602" y="674" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Parse</text><text x="566" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Converted into the canonical</text><text x="566" y="746" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >invoice.</text><path d="M794 666 h14" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="810" y="636" width="230" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="828" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >4</text><text x="850" y="674" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Match company</text><text x="814" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Your buyer company found by</text><text x="814" y="746" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >tax number.</text><path d="M1042 666 h14" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1058" y="636" width="230" height="60" rx="14" fill="#16B8A5" stroke="none" stroke-width="1.5" /><text x="1076" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >5</text><text x="1098" y="674" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >Validate</text><text x="1062" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Same rule set as outbound.</text><path d="M1290 666 h14" fill="none" stroke="#101C35" stroke-width="2.2" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="1306" y="636" width="230" height="60" rx="14" fill="#16A875" stroke="none" stroke-width="1.5" /><text x="1324" y="673" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.7" >6</text><text x="1346" y="674" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start" >ERP draft</text><text x="1310" y="726" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Purchase invoice drafted in</text><text x="1310" y="746" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >your ERP.</text><rect x="66" y="790" width="1468" height="48" rx="12" fill="#F4F7FB" stroke="none" stroke-width="1.5" /><text x="90" y="821" font-size="15" font-weight="700" fill="#101C35" text-anchor="start" >Retries, duplicate protection and transaction locks keep both directions safe.</text><path d="M60 934 H1540" fill="none" stroke="#D5DEEA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="962" font-size="13" font-weight="500" fill="#8A97A8" text-anchor="start" >Peppol interoperability complements, and does not replace, national tax-authority requirements.</text><text x="1540" y="962" font-size="13" font-weight="700" fill="#2878E5" text-anchor="end" >kreatao.com/E-InvoiceHub</text></svg>