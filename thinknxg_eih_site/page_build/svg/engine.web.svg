4" y="495" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >Payload preserved</text><path d="M414 288 h16" fill="none" stroke="#101C35" stroke-width="2.4" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="432" y="239" width="352" height="290" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="432" y="236" width="352" height="290" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.4" /><rect x="432" y="236" width="352" height="8" rx="4" fill="#1F9AD8" stroke="none" stroke-width="1.5" /><circle cx="468" cy="288" r="20" fill="#1F9AD8" stroke="none" stroke-width="1.5"/><text x="468" y="294" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" >2</text><text x="498" y="294" font-size="16.5" font-weight="800" fill="#101C35" text-anchor="start" >Country-specific compliance</text><text x="452" y="342" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >The engine for the invoice's country is</text><text x="452" y="363" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >selected automatically.</text><rect x="452" y="434" width="187.6" height="32" rx="16" fill="#F4F7FB" stroke="#1F9AD8" stroke-width="1.4" /><text x="466" y="455" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >UAE · PINT AE 1.0.5</text><rect x="452" y="474" width="196.0" height="32" rx="16" fill="#F4F7FB" stroke="#1F9AD8" stroke-width="1.4" /><text x="466" y="495" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >Oman · PINT OM 1.0.1</text><path d="M786 288 h16" fill="none" stroke="#101C35" stroke-width="2.4" marker-end="url(#m101C35e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="804" y="239" width="352" height="290" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="804" y="236" width="352" height="290" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.4" /><rect x="804" y="236" 