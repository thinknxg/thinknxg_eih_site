 country's</text><text x="1196" y="363" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >published PINT specification.</text><rect x="1196" y="434" width="221.2" height="32" rx="16" fill="#F4F7FB" stroke="#16B8A5" stroke-width="1.4" /><text x="1210" y="455" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >UAE · UUID, AED amounts</text><rect x="1196" y="474" width="229.6" height="32" rx="16" fill="#F4F7FB" stroke="#16B8A5" stroke-width="1.4" /><text x="1210" y="495" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >Oman · UUIDs, QR payload</text><rect x="60" y="569" width="352" height="290" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="60" y="566" width="352" height="290" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.4" /><rect x="60" y="566" width="352" height="8" rx="4" fill="#13A98B" stroke="none" stroke-width="1.5" /><circle cx="96" cy="618" r="20" fill="#13A98B" stroke="none" stroke-width="1.5"/><text x="96" y="624" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" >5</text><text x="126" y="624" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >Provider integration</text><text x="80" y="672" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >Documents go out through the ASP adapter</text><text x="80" y="693" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >you configure.</text><rect x="80" y="764" width="162.4" height="32" rx="16" fill="#F4F7FB" stroke="#13A98B" stroke-width="1.4" /><text x="94" y="785" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >Provider-neutral</text><rect x="80" y="804" width="170.79999999999998" height="32" rx="16" fill="#F4F7FB" stroke="#13A98B" stroke-width="1.4" /><text x="94" y="825" font-size="14" font-weight="700" fill="#101C35" text-anchor="start" >Configurable REST</text><path d="M414 618 h16" fill="none" stroke="#101C35" stroke-wi