rd.</text><rect x="432" y="427" width="352" height="184" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="432" y="424" width="352" height="184" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="432" y="444" width="5" height="144" rx="2.5" fill="#16B8A5" stroke="none" stroke-width="1.5" /><path d="M459.6 456.8 H481.2 M475.8 451.4 L481.2 456.8 L475.8 462.2 M488.4 471.2 H466.8 M472.2 465.8 L466.8 471.2 L472.2 476.6" fill="none" stroke="#16B8A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="506" y="474" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >Transaction lifecycle</text><text x="456" y="524" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >Separate validation, provider,</text><text x="456" y="546" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >regulatory and Peppol states.</text><rect x="804" y="427" width="352" height="184" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="804" y="424" width="352" height="184" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="804" y="444" width="5" height="144" rx="2.5" fill="#2878E5" stroke="none" stroke-width="1.5" /><path d="M858.6 462.2 A13.68 13.68 0 1 0 853.2 474.08" fill="none" stroke="#2878E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M858.6 451.4 v10.799999999999999 h-10.799999999999999" fill="none" stroke="#2878E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="878" y="474" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >Retry processing</text><text x="828" y="524" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >Automatic retries for provider</text><text x="828" y="546" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >timeouts.</text><rect x="1176" y="427" width="352" height="184" rx="16" fill="#101C35" 