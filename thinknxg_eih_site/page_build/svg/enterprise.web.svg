one" stroke-width="1.5" opacity="0.05" /><rect x="432" y="624" width="352" height="184" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="432" y="644" width="5" height="144" rx="2.5" fill="#16B8A5" stroke="none" stroke-width="1.5" /><rect x="463.2" y="661.12" width="21.599999999999998" height="17.28" rx="5" fill="none" stroke="#16B8A5" stroke-width="2" /><path d="M467.88 661.12 v-4.32 a6.12 6.12 0 0 1 12.24 0 v4.32" fill="none" stroke="#16B8A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="506" y="674" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >Transaction locks</text><text x="456" y="724" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >One processor per invoice at a time.</text><rect x="804" y="627" width="352" height="184" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="804" y="624" width="352" height="184" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="804" y="644" width="5" height="144" rx="2.5" fill="#2878E5" stroke="none" stroke-width="1.5" /><circle cx="843.12" cy="661.12" r="10.080000000000002" fill="none" stroke="#2878E5" stroke-width="2"/><path d="M850.32 668.32 L860.4 678.4" fill="none" stroke="#2878E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="878" y="674" font-size="19" font-weight="800" fill="#101C35" text-anchor="start" >Duplicate protection</text><text x="828" y="724" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >Repeat submissions return the</text><text x="828" y="746" font-size="15" font-weight="500" fill="#536174" text-anchor="start" >original transaction.</text><rect x="1176" y="627" width="352" height="184" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="1176" y="624" width="352" height="184" rx="16" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="1176" y="644" width="5" height="144" rx="2.5