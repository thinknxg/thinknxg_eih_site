"start" >ERPNext · other ERP systems</text><rect x="310" y="470" width="220" height="150" rx="16" fill="#101C35" stroke="#21C5D9" stroke-width="2.4" /><path d="M420.0 505.0 L405.72 492.4" fill="none" stroke="#21C5D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="405.72" cy="492.4" r="3.78" fill="none" stroke="#21C5D9" stroke-width="2"/><path d="M420.0 505.0 L434.28 492.4" fill="none" stroke="#21C5D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="434.28" cy="492.4" r="3.78" fill="none" stroke="#21C5D9" stroke-width="2"/><path d="M420.0 505.0 L405.72 517.6" fill="none" stroke="#21C5D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="405.72" cy="517.6" r="3.78" fill="none" stroke="#21C5D9" stroke-width="2"/><path d="M420.0 505.0 L434.28 517.6" fill="none" stroke="#21C5D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="434.28" cy="517.6" r="3.78" fill="none" stroke="#21C5D9" stroke-width="2"/><circle cx="420.0" cy="505.0" r="6.3" fill="#21C5D9" stroke="#21C5D9" stroke-width="1"/><text x="420" y="558" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >thinkNXG</text><text x="420" y="580" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >E-Invoice Hub</text><text x="420" y="602" font-size="13" font-weight="600" fill="#21C5D9" text-anchor="middle" >PINT OM engine</text><rect x="580" y="473" width="230" height="150" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.06" /><rect x="580" y="470" width="230" height="150" rx="16" fill="#FFFFFF" stroke="#2E9D62" stroke-width="2" /><rect x="596" y="486" width="46" height="24" rx="12" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="619" y="503" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" >C2</text><text x="596" y="538" font-size="19.5" font-weight="800" fill="#101C35" text-anchor="start" >Seller's provider</text><text x="596" y="562" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Accredited provider</text><text x="596" y="581" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >(your choice)</text><rect x="940" y="473" width="230" height="150" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.06" /><rect x="940" y="470" width="230" height="150" rx="16" fill="#FFFFFF" stroke="#2E9D62" stroke-width="2" /><rect x="956" y="486" width="46" height="24" rx="12" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="979" y="503" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" >C3</text><text x="956" y="538" font-size="21" font-weight="800" fill="#101C35" text-anchor="start" >Buyer's provider</text><text x="956" y="562" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Receives over Peppol</text><rect x="1290" y="473" width="240" height="150" rx="16" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.06" /><rect x="1290" y="470" width="240" height="150" rx="16" fill="#FFFFFF" stroke="#2E9D62" stroke-width="2" /><rect x="1306" y="486" width="46" height="24" rx="12" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="1329" y="503" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" >C4</text><text x="1306" y="538" font-size="21" font-weight="800" fill="#101C35" text-anchor="start" >Buyer</text><text x="1306" y="562" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Receives the PINT OM</text><text x="1306" y="581" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >invoice</text><path d="M270 545 C290.0 545 290.0 545 310 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><path d="M530 545 C555.0 545 555.0 545 580 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><path d="M810 545 H940" fill="none" stroke="#2878E5" stroke-width="5" marker-end="url(#m2878E5e)" marker-start="url(#m2878E5s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="837.8" y="496" width="74.4" height="28" rx="14" fill="#FFFFFF" stroke="#2878E5" stroke-width="1.4" /><text x="875" y="515" font-size="14" font-weight="700" fill="#2878E5" text-anchor="middle" >Peppol</text><path d="M1170 545 C1230.0 545 1230.0 545 1290 545" fill="none" stroke="#21C5D9" stroke-width="3" marker-end="url(#m21C5D9e)" marker-start="url(#m21C5D9s)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><path d="M1055 470 C1055 415.0 1015 415.0 1015 360" fill="none" stroke="#2E9D62" stroke-width="2.4" marker-end="url(#m2E9D62e)" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="991.7" y="411" width="156.6" height="28" rx="14" fill="#FFFFFF" stroke="#2E9D62" stroke-width="1.4" /><text x="1070" y="430" font-size="13" font-weight="700" fill="#2E9D62" text-anchor="middle" >Tax Data Document</text><path d="M1150 296 H1260" fill="none" stroke="#2E9D62" stroke-width="2.6" marker-end="url(#m2E9D62e)" stroke-linecap="round" stroke-linejoin="round" /><path d="M700 624 V690 H1055 V624" fill="none" stroke="#2878E5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m2878E5e)" stroke-linecap="round" stroke-linejoin="round" /><rect x="774.4" y="676" width="211.2" height="28" rx="14" fill="#FFFFFF" stroke="#2878E5" stroke-width="1.4" /><text x="880" y="695" font-size="13" font-weight="700" fill="#2878E5" text-anchor="middle" >Status messages returned</text><text x="60" y="735" font-size="13" font-weight="800" fill="#2E9D62" text-anchor="start" letter-spacing="1.6" >WHAT THE HUB PREPARES FOR OMAN</text><rect x="60" y="760" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="60" y="760" width="352" height="6" rx="3" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="78" y="800" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >Oman VAT data</text><text x="78" y="828" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >VATIN, effective-dated rates, reason codes</text><text x="78" y="847" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >and OMR amounts to three decimals.</text><rect x="432" y="760" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="432" y="760" width="352" height="6" rx="3" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="450" y="800" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >Invoice and Seller UUID</text><text x="450" y="828" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Identifiers and the QR payload for the</text><text x="450" y="847" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >printed invoice, generated for you.</text><rect x="804" y="760" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="804" y="760" width="352" height="6" rx="3" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="822" y="800" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >Every invoice type</text><text x="822" y="828" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Tax invoices, credit notes, self-billing,</text><text x="822" y="847" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >B2C, exports and foreign currency.</text><rect x="1176" y="760" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="1176" y="760" width="352" height="6" rx="3" fill="#2E9D62" stroke="none" stroke-width="1.5" /><text x="1194" y="800" font-size="18" font-weight="800" fill="#101C35" text-anchor="start" >Status management</text><text x="1194" y="828" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >Provider and authority status messages</text><text x="1194" y="847" font-size="14" font-weight="500" fill="#536174" text-anchor="start" >mapped to reporting and delivery outcomes.</text><path d="M60 934 H1540" fill="none" stroke="#D5DEEA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="962" font-size="13" font-weight="500" fill="#8A97A8" text-anchor="start" >Built to Peppol PINT OM 1.0.1. The accredited provider handles transmission, the Tax Data Document and authority reporting.</text><text x="1540" y="962" font-size="13" font-weight="700" fill="#2878E5" text-anchor="end" >kreatao.com/E-InvoiceHub</text></svg>