<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1600 810" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Oman Fawtara architecture</title><desc id="d">The seller's ERP connects through the hub to the seller's accredited provider, which exchanges the PINT OM invoice over Peppol with the buyer's provider and buyer; a Tax Data Document is reported to the Oman Tax Authority and status messages return.</desc><defs><style>.flow{stroke-dasharray:7 9;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pulse{animation:pl 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{50%{transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2878E5"/><stop offset="1" stop-color="#21C5D9"/></linearGradient><radialGradient id="gli2"><stop offset="0" stop-color="#2E9D62" stop-opacity="0.06"/><stop offset="1" stop-color="#2E9D62" stop-opacity="0"/></radialGradient><marker id="m21C5D9e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#21C5D9"/></marker><marker id="m21C5D9s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#21C5D9"/></marker><marker id="m2878E5e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2878E5"/></marker><marker id="m2878E5s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2878E5"/></marker><marker id="m2E9D62e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2E9D62"/></marker></defs><rect width="1600" height="1000" fill="#F4F7FB"/><text x