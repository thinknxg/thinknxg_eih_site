 font-size="22" font-weight="800" fill="#101C35" text-anchor="start" >Simplified operations</text><text x="456" y="736" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >Retries, reconciliation and status</text><text x="456" y="758" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >sync handled for you.</text><rect x="456" y="814" width="60" height="4" rx="2" fill="#16B8A5" stroke="none" stroke-width="1.5" /><rect x="804" y="555" width="352" height="290" rx="18" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="804" y="552" width="352" height="290" rx="18" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="828" y="580" width="72" height="72" rx="20" fill="#2878E5" stroke="none" stroke-width="1.5" opacity="0.12" /><path d="M848.0 608.0 H872.0 M866.0 602.0 L872.0 608.0 L866.0 614.0 M880.0 624.0 H856.0 M862.0 618.0 L856.0 624.0 L862.0 630.0" fill="none" stroke="#2878E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="828" y="702" font-size="21.5" font-weight="800" fill="#101C35" text-anchor="start" >Global interoperability</text><text x="828" y="736" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >Peppol-based exchange across</text><text x="828" y="758" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >borders.</text><rect x="828" y="814" width="60" height="4" rx="2" fill="#2878E5" stroke="none" stroke-width="1.5" /><rect x="1176" y="555" width="352" height="290" rx="18" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="1176" y="552" width="352" height="290" rx="18" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="1200" y="580" width="72" height="72" rx="20" fill="#16B8A5" stroke="none" stroke-width="1.5" opacity="0.12" /><path d="M1236.0 602.0 l16.0 5.6000000000000005 l-16.0 5.6000000000000005 l-16.0 -5.6000000000000005 z" fill="none" stroke="#16B8A5" stroke-width="2" stroke-linecap="round" str