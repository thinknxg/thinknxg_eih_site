nt-weight="500" fill="#536174" text-anchor="start" >Connect each ERP once, not once</text><text x="84" y="438" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >per country or provider.</text><rect x="84" y="494" width="60" height="4" rx="2" fill="#2878E5" stroke="none" stroke-width="1.5" /><rect x="432" y="235" width="352" height="290" rx="18" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="432" y="232" width="352" height="290" rx="18" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="456" y="260" width="72" height="72" rx="20" fill="#16B8A5" stroke="none" stroke-width="1.5" opacity="0.12" /><circle cx="492.0" cy="296.0" r="18.0" fill="none" stroke="#16B8A5" stroke-width="2"/><path d="M474.0 296.0 H510.0" fill="none" stroke="#16B8A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M492.0 278.0 C475.8 288.8 475.8 303.2 492.0 314.0" fill="none" stroke="#16B8A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M492.0 278.0 C508.2 288.8 508.2 303.2 492.0 314.0" fill="none" stroke="#16B8A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="456" y="382" font-size="20.5" font-weight="800" fill="#101C35" text-anchor="start" >Multi-country compliance</text><text x="456" y="416" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >Dedicated UAE and Oman engines on</text><text x="456" y="438" font-size="16" font-weight="500" fill="#536174" text-anchor="start" >one foundation.</text><rect x="456" y="494" width="60" height="4" rx="2" fill="#16B8A5" stroke="none" stroke-width="1.5" /><rect x="804" y="235" width="352" height="290" rx="18" fill="#101C35" stroke="none" stroke-width="1.5" opacity="0.05" /><rect x="804" y="232" width="352" height="290" rx="18" fill="#FFFFFF" stroke="#D5DEEA" stroke-width="1.5" /><rect x="828" y="260" width="72" height="72" rx="20" fill="#2878E5" stroke="none" stroke-width="1.5" opacity="0.12" /><